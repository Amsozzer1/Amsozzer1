name: ci

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # A monthly redeploy keeps the Expires date in security.txt from lapsing.
    - cron: '23 5 1 * *'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history: sitemap lastmod and JSON-LD dateModified come from git.
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: typst-community/setup-typst@v5
        with:
          typst-version: '0.15.1'
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm check
      # The résumé is generated into public/ so the build copies it into dist.
      - run: pnpm resume
      - run: pnpm build
      - run: pnpm validate:html
      - run: sudo apt-get install -y poppler-utils
      - name: Content check
        run: node scripts/check-content.ts
        env:
          CONTENT_DENYLIST: ${{ secrets.CONTENT_DENYLIST }}
          CHECK_EM_DASH: ${{ vars.CHECK_EM_DASH }}
      - name: Check internal links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --root-dir ${{ github.workspace }}/dist --config lychee.toml -- dist
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist
          # Keeps dist/.well-known/security.txt in the deployed build.
          include-hidden-files: true
          retention-days: 7

  lighthouse:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: ./lighthouserc.json
          uploadArtifacts: true

      # The colophon prints these, so they come from the run rather than from memory.
      # Only a moved score earns a commit. Stamping the SHA every run rewrote a file
      # nobody reads, and once the ruleset closed main that churn failed the deploy
      # along with it.
      - name: Record the scores
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module -e '
            import { readdirSync, readFileSync, writeFileSync } from "node:fs";

            const dir = ".lighthouseci";
            const report = readdirSync(dir)
              .filter(name => name.startsWith("lhr-") && name.endsWith(".json"))
              .map(name => JSON.parse(readFileSync(`${dir}/${name}`, "utf8")))
              .find(lhr => new URL(lhr.finalDisplayedUrl ?? lhr.finalUrl).pathname.endsWith("index.html"));

            if (!report) throw new Error("no Lighthouse report for the home page");

            const round = category => Math.round(report.categories[category].score * 100);
            const scores = {
              performance: round("performance"),
              accessibility: round("accessibility"),
              bestPractices: round("best-practices"),
              seo: round("seo"),
            };

            const path = "src/data/lighthouse.json";
            const previous = JSON.parse(readFileSync(path, "utf8"));

            if (JSON.stringify(previous.scores) === JSON.stringify(scores)) {
              process.stdout.write("scores unchanged\n");
            } else {
              writeFileSync(
                path,
                `${JSON.stringify(
                  {
                    commit: process.env.GITHUB_SHA.slice(0, 7),
                    measuredAt: new Date().toISOString().slice(0, 10),
                    url: "https://amsozzer.com/",
                    scores,
                  },
                  null,
                  2,
                )}\n`,
              );
            }
          '

          if git diff --quiet src/data/lighthouse.json; then
            exit 0
          fi

          # main takes pull requests only, so a moved score arrives as one.
          branch=lighthouse-scores
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add src/data/lighthouse.json
          git commit -m "Record Lighthouse scores from CI"
          git push --force origin "$branch"

          gh pr list --head "$branch" --state open --json number --jq '.[].number' | grep -q . && exit 0

          # Actions is not always permitted to open a pull request here. The branch is pushed
          # either way, so a blocked PR is a warning rather than a failure: these scores are
          # bookkeeping for the colophon, and must never decide whether the site deploys.
          gh pr create --base main --head "$branch" \
            --title "Record Lighthouse scores from CI" \
            --body "A Lighthouse category score moved. Opened by the \`lighthouse\` job." ||
            echo "::warning::Scores PR was not opened; branch $branch is pushed, open it by hand."

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: [verify, lighthouse]
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://amsozzer.com
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: pnpm
          command: deploy
      - name: Ping IndexNow
        if: github.event_name == 'push' && vars.INDEXNOW_KEY != ''
        run: pnpm indexnow
        env:
          INDEXNOW_KEY: ${{ vars.INDEXNOW_KEY }}

  preview:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    needs: [verify, lighthouse]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    environment:
      name: preview
      url: ${{ steps.upload.outputs.deployment-url }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - id: upload
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: pnpm
          command: versions upload --preview-alias pr-${{ github.event.pull_request.number }}
      - name: Comment the preview URL
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
          WRANGLER_OUTPUT: ${{ steps.upload.outputs.command-output }}
          VERSION_URL: ${{ steps.upload.outputs.deployment-url }}
        run: |
          alias_url=$(sed -n 's/^.*Version Preview Alias URL: *//p' <<< "$WRANGLER_OUTPUT")
          body="Preview of ${SHA::7}: ${alias_url:-$VERSION_URL}"
          gh pr comment "$PR" --body "$body" --edit-last --create-if-none
