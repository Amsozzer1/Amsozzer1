name: ci

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # A monthly redeploy keeps the Expires date in security.txt from lapsing.
    - cron: '23 5 1 * *'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history: sitemap lastmod and JSON-LD dateModified come from git.
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: typst-community/setup-typst@v5
        with:
          typst-version: '0.15.1'
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm check
      # The résumé is generated into public/ so the build copies it into dist.
      - run: pnpm resume
      - run: pnpm build
      - run: pnpm validate:html
      - name: Check internal links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --root-dir ${{ github.workspace }}/dist --config lychee.toml -- dist
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist
          # Keeps dist/.well-known/security.txt in the deployed build.
          include-hidden-files: true
          retention-days: 7

  lighthouse:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: ./lighthouserc.json
          uploadArtifacts: true

      # The colophon prints these, so they come from the run rather than from memory.
      - name: Record the scores
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          node --input-type=module -e '
            import { readdirSync, readFileSync, writeFileSync } from "node:fs";

            const dir = ".lighthouseci";
            const report = readdirSync(dir)
              .filter(name => name.startsWith("lhr-") && name.endsWith(".json"))
              .map(name => JSON.parse(readFileSync(`${dir}/${name}`, "utf8")))
              .find(lhr => new URL(lhr.finalDisplayedUrl ?? lhr.finalUrl).pathname.endsWith("index.html"));

            if (!report) throw new Error("no Lighthouse report for the home page");

            const round = category => Math.round(report.categories[category].score * 100);

            writeFileSync(
              "src/data/lighthouse.json",
              `${JSON.stringify(
                {
                  commit: process.env.GITHUB_SHA.slice(0, 7),
                  measuredAt: new Date().toISOString().slice(0, 10),
                  url: "https://amsozzer.com/",
                  scores: {
                    performance: round("performance"),
                    accessibility: round("accessibility"),
                    bestPractices: round("best-practices"),
                    seo: round("seo"),
                  },
                },
                null,
                2,
              )}\n`,
            );
          '

          if git diff --quiet src/data/lighthouse.json; then
            echo "scores unchanged"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/lighthouse.json
          git commit -m "Record Lighthouse scores from CI [skip ci]"
          git pull --rebase
          git push

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: [verify, lighthouse]
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://amsozzer.com
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: pnpm
          command: deploy
      - name: Ping IndexNow
        if: github.event_name == 'push' && vars.INDEXNOW_KEY != ''
        run: pnpm indexnow
        env:
          INDEXNOW_KEY: ${{ vars.INDEXNOW_KEY }}

  preview:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    needs: [verify, lighthouse]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    environment:
      name: preview
      url: ${{ steps.upload.outputs.deployment-url }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - id: upload
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: pnpm
          command: versions upload --preview-alias pr-${{ github.event.pull_request.number }}
      - name: Comment the preview URL
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
          WRANGLER_OUTPUT: ${{ steps.upload.outputs.command-output }}
          VERSION_URL: ${{ steps.upload.outputs.deployment-url }}
        run: |
          alias_url=$(sed -n 's/^.*Version Preview Alias URL: *//p' <<< "$WRANGLER_OUTPUT")
          body="Preview of ${SHA::7}: ${alias_url:-$VERSION_URL}"
          gh pr comment "$PR" --body "$body" --edit-last --create-if-none
