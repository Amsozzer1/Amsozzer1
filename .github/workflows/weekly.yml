name: weekly

on:
  schedule:
    - cron: '37 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Check external links
        uses: lycheeverse/lychee-action@v2
        with:
          # @TODO: drop the amsozzer.com exclude after launch so this run also smoke-tests production
          args: >-
            --root-dir ${{ github.workspace }}/dist --config lychee.toml
            --exclude '^https://amsozzer\.com' -- dist
      - name: Open or update the issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TITLE: Weekly link check failed
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          report=lychee/out.md
          if [ ! -f "$report" ]; then
            report="$RUNNER_TEMP/report.md"
            echo "The weekly run failed before the link check: $RUN_URL" > "$report"
          fi
          number=$(gh issue list --state open --search "\"$TITLE\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh issue comment "$number" --body-file "$report"
          else
            gh issue create --title "$TITLE" --body-file "$report"
          fi
